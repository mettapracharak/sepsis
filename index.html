<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#172a4f">
  <title>ทะเบียน Sepsis · PCT อายุรกรรม</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f2f4f8; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    .fallback { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      font: 13px/1.4 "Tahoma", system-ui, sans-serif; color: #47536b; background: #fff;
      border: 1px solid #dde3ec; border-radius: 8px; padding: 6px 12px; display: none; }
    .fallback a { color: #1d7f70; }
  </style>
</head>
<body>
  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbyOej6rBNK8gJeGYYW33SaYPCoO4AkH58pxncctfu7pMfTMiUa0K6_8IGrKkq9LrlriIg/exec"
    title="ทะเบียนผู้ป่วย Sepsis" allow="clipboard-write"></iframe>
  <div class="fallback" id="fb">หน้าไม่ขึ้น? <a href="https://script.google.com/macros/s/AKfycbyOej6rBNK8gJeGYYW33SaYPCoO4AkH58pxncctfu7pMfTMiUa0K6_8IGrKkq9LrlriIg/exec">เปิดโดยตรง</a></div>
  <script>
    // ถ้าโหลดไม่ขึ้นภายใน 12 วินาที แสดงลิงก์เปิดตรง
    var loaded = false;
    document.getElementById('app').addEventListener('load', function () { loaded = true; });
    setTimeout(function () { if (!loaded) document.getElementById('fb').style.display = 'block'; }, 12000);
  </script>
</body>
</html>
